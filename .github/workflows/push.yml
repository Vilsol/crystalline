name: push

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # mise.toml pins both Go and golangci-lint, so CI and a developer's
      # machine cannot drift apart.
      - name: Set up tools
        uses: jdx/mise-action@v4

      - name: Test
        run: ./run_tests.sh

      - name: Codecov
        uses: codecov/codecov-action@v7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v4

      - name: Lint
        run: golangci-lint run ./...

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v4

      # Builds every example for wasm and runs it under node, so an example that
      # has stopped working fails here rather than in someone's browser.
      - name: Examples
        run: ./examples/check.sh

      # The generated files are committed so they can be read on their own. This
      # catches the case where the generator changed and they were not updated.
      - name: Generated output is current
        run: git diff --exit-code examples
