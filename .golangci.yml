version: "2"
linters:
  default: none
  enable:
    - bidichk
    - contextcheck
    - durationcheck
    - errcheck
    - errorlint
    - goconst
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unused
    - whitespace
    - wrapcheck
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    rules:
      # The command hands its errors straight to main, which prints them with a
      # prefix. They already carry their own context, so wrapping again would
      # only repeat it.
      - path: cmd/
        linters:
          - wrapcheck
      # Fixtures exist to be generated from, not to be exemplary Go.
      - path: testdata/
        linters:
          - revive
          - unused
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
